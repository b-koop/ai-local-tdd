name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  NPM_REGISTRY: https://registry.npmjs.org
  PACKAGE_NAME: "@ai-local/tdd"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out published release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match" \
              "package.json version $package_version" >&2
            exit 1
          fi
          echo "Validated release version $package_version"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Publish unless version already exists
        run: |
          set -eu
          package_version="$(node -p "require('./package.json').version")"
          package_spec="$PACKAGE_NAME@$package_version"
          exact_version="$(npm view "$package_spec" version --json \
            2>/dev/null || true)"
          if [ "$exact_version" = "\"$package_version\"" ] ||
             [ "$exact_version" = "$package_version" ]; then
            echo "$PACKAGE_NAME@$package_version is already published;"
            echo "skipping."
            exit 0
          fi
          versions="$(npm view "$PACKAGE_NAME" versions --json)"
          if node <<'NODE' "$versions" "$package_version"
          const versions = JSON.parse(process.argv[2]);
          const version = process.argv[3];
          const list = Array.isArray(versions) ? versions : [versions];
          process.exit(list.includes(version) ? 0 : 1);
          NODE
          then
            echo "$PACKAGE_NAME@$package_version is already published;"
            echo "skipping."
            exit 0
          fi
          npm publish --provenance --access public
